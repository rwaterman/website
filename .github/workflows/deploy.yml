name: Deploy site

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.env || github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: target
        env:
          REQUESTED_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_ENV" ]; then
            TARGET_ENV="$REQUESTED_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi

          case "$TARGET_ENV" in
            prod)
              echo "name=prod" >> "$GITHUB_OUTPUT"
              echo "site=https://rickwaterman.com" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "name=dev" >> "$GITHUB_OUTPUT"
              echo "site=https://dev.rickwaterman.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        env:
          SITE: ${{ steps.target.outputs.site }}
          # Public-repo reads for /projects; the default token raises the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Block indexing on dev
        if: steps.target.outputs.name == 'dev'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/website-content-${{ steps.target.outputs.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets
        id: targets
        run: |
          BUCKET=$(aws ssm get-parameter --name "/website/${{ steps.target.outputs.name }}/bucket-name" --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter --name "/website/${{ steps.target.outputs.name }}/distribution-id" --query Parameter.Value --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          # Content-hashed assets only: cache forever. --delete is filter-aware.
          aws s3 sync dist/ "s3://${{ steps.targets.outputs.bucket }}" --delete \
            --exclude "*" --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (HTML, favicon, robots.txt): always revalidate so these are
          # never stuck in a browser cache and a CloudFront invalidation fully refreshes them.
          aws s3 sync dist/ "s3://${{ steps.targets.outputs.bucket }}" --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution }}" \
            --paths "/*"
