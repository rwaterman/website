version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @astrojs/check 0.9.x accepts typescript ^5 || ^6 as a peer; a major bump breaks `npm ci`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
